<!doctype html><html><head><meta charset="utf-8"><title>SIFY Migration Login</title><style>body{font-family:Arial;background:#f3f5f8}.wrap{max-width:430px;margin:90px auto}.card{background:#fff;padding:32px;border-radius:14px;box-shadow:0 4px 18px #0001}input,button{width:100%;padding:12px;margin:8px 0;box-sizing:border-box;border-radius:8px;border:1px solid #ccd3db}button{background:#1769d1;color:#fff;border:0;font-weight:bold}.err{background:#fee2e2;padding:10px;border-radius:8px}</style></head><body><div class="wrap"><div class="card"><h1>SIFY Migration Tool</h1><p>Module 1 — Basic Configuration</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for cat,msg in messages %}<div class="err">{{msg}}</div>{% endfor %}{% endwith %}<form method="post"><input name="username" placeholder="Username" required><input name="password" type="password" placeholder="Password" required><button>Login</button></form></div></div></body></html>
