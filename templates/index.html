<!doctype html><html><head><meta charset="utf-8"><title>SIFY Migration</title><style>body{font-family:Arial;background:#f3f5f8}.wrap{max-width:900px;margin:35px auto}.card{background:#fff;padding:24px;margin-bottom:18px;border-radius:14px;box-shadow:0 3px 14px #0001}input,button{padding:12px;border-radius:8px;border:1px solid #ccd3db}input{width:70%;box-sizing:border-box}button{background:#1769d1;color:#fff;border:0;font-weight:bold}.err{background:#fee2e2;padding:10px}.ok{background:#eaf7ed;padding:10px}</style></head><body><div class="wrap"><div class="card"><div style="text-align:right">{{user}} · <a href="/logout">Logout</a></div><h1>SIFY Migration Tool</h1><div class="ok">{{status}}</div></div>{% with messages=get_flashed_messages(with_categories=true) %}{% for cat,msg in messages %}<div class="card err">{{msg}}</div>{% endfor %}{% endwith %}<div class="card"><h2>1. Basic Configuration</h2><form method="post" action="/lookup"><input name="branch_code" placeholder="Branch Code e.g. 1183" required><button>Fetch Branch</button></form></div></div></body></html>
